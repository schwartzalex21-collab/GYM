<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6eff" />
      <stop offset="100%" stop-color="#6b52d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#aa802c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0a0a0f" />
  <!-- Outer Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#8a6eff" stroke-width="4" stroke-opacity="0.2" />
  
  <!-- Symbol: Stylized H or Dagger -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Main shape (Violet) -->
    <path d="M 40 40 L 80 40 L 80 216 L 40 216 Z" fill="url(#violetGrad)" />
    <path d="M 176 40 L 216 40 L 216 216 L 176 216 Z" fill="url(#violetGrad)" />
    <path d="M 80 110 L 176 110 L 176 146 L 80 146 Z" fill="url(#violetGrad)" />
    
    <!-- Accent shape (Gold) -->
    <path d="M 128 40 L 150 70 L 106 70 Z" fill="url(#goldGrad)" />
    <path d="M 120 70 L 136 70 L 136 100 L 120 100 Z" fill="url(#goldGrad)" />
  </g>
  
  <!-- Level Text or Rank -->
  <text x="256" y="440" font-family="'Bebas Neue', sans-serif" font-size="48" fill="#d4a843" text-anchor="middle" letter-spacing="4">HUNTER</text>
</svg>
